<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kazán-Gólya fűtés: rendszerállapot</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" type="text/css" href="styles.css">

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/p5js@1.2.18/p5.js/p5.min.js"></script>
    <script src="https://unpkg.com/p5.js-svg@1.5.1"></script>
    <script src="codebase.js?v=20261111-replay2"></script>
    <script src="dashboard_i18n.js?v=20261111-replay2"></script>
    <script src="dashboard_replay.js?v=20261111-replay2"></script>

    <link rel="stylesheet" href="dashboard_styling.css?v=20261111-replay2">
</head>

<body>
    <div id="container"></div>
    <div id="tooltip"
        style="position: absolute; visibility: hidden; background-color: white; border: 1px solid black; padding: 5px; pointer-events: none;">
    </div>
    <section id="admin-message" class="dashboard-message" role="dialog" aria-label="Adminisztrátori üzenet" tabindex="-1" hidden>
        <button id="admin-message-close" class="dashboard-message-close" type="button" aria-label="Üzenet bezárása">×</button>
        <div id="admin-message-content" class="dashboard-message-content"></div>
        <div class="admin-message-actions">
            <button id="admin-message-ok" class="dashboard-message-ok" type="button">Ok</button>
            <a href="mailto:markus.benjamin@gmail.com?subject=f%C5%B1t%C3%A9s%20k%C3%A9rd%C3%A9s">Kérdésem van</a>
        </div>
    </section>
    <nav id="dashboard-page-tools" aria-label="Nyelv és súgó">
        <button id="demo-help-launcher" type="button" aria-controls="demo-help" aria-expanded="false" hidden>mi ez?</button>
        <a id="dashboard-language-hu" href="?lang=hu" lang="hu" hreflang="hu" aria-label="Magyar" title="Magyar" hidden>hu</a>
        <a id="dashboard-language-en" href="?lang=en" lang="en" hreflang="en" aria-label="English" title="English" hidden>en</a>
    </nav>
    <section id="demo-help" class="dashboard-message" role="dialog" aria-label="A dashboard használata" tabindex="-1" hidden>
        <button id="demo-help-close" class="dashboard-message-close" type="button" aria-label="Súgó bezárása">×</button>
        <div id="demo-help-content" class="dashboard-message-content"></div>
        <div class="admin-message-actions"><button id="demo-help-ok" class="dashboard-message-ok" type="button">Ok</button></div>
    </section>
    <section id="replay-pane" class="dashboard-message" role="dialog" aria-label="Replay" hidden>
        <button id="replay-size" class="replay-window-button" type="button" aria-expanded="true" aria-label="Minimize" title="Minimize">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path class="replay-minimize-icon" d="M4 12H16"/><path class="replay-expand-icon" d="M3 7H13V17H3ZM7 7V3H17V13H13"/></svg>
        </button>
        <button id="replay-close" class="replay-window-button" type="button" aria-label="Close">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5 15 15M15 5 5 15"/></svg>
        </button>
        <div class="replay-date-row">
            <button id="replay-previous-day" class="replay-day-arrow" type="button" aria-label="Előző nap" title="Előző nap">‹</button>
            <label class="replay-date-picker">
                <span id="replay-date-display"></span>
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5H17V17H3ZM3 8H17M6 2V6M14 2V6"/></svg>
                <input id="replay-day" type="date" aria-label="Dátum">
            </label>
            <button id="replay-next-day" class="replay-day-arrow" type="button" aria-label="Következő nap" title="Következő nap">›</button>
            <button id="replay-load" type="button" aria-label="Betöltés" title="Betöltés">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 7A6.5 6.5 0 0 0 5 4L2 7M2 3V7H6M4 13A6.5 6.5 0 0 0 15 16L18 13M18 17V13H14"/></svg>
            </button>
        </div>
        <p id="replay-status" role="status"></p>
        <fieldset id="replay-controls" disabled>
            <output id="replay-compact-date"></output>
            <output id="replay-time">00:00:00</output>
            <input id="replay-timeline" type="range" min="0" max="86399" step="1" value="0" aria-label="Replay time">
        </fieldset>
        <div class="replay-actions">
            <div class="replay-transport" role="group" aria-label="Playback">
                <button id="replay-play" type="button" aria-label="Play" title="Play" disabled>
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3 17 10 5 17Z" fill="currentColor"/></svg>
                </button>
                <button id="replay-pause" type="button" aria-label="Pause" title="Pause" disabled>
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3H8V17H5ZM12 3H15V17H12Z" fill="currentColor"/></svg>
                </button>
                <button id="replay-stop" type="button" aria-label="Stop" title="Stop" disabled>
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4H16V16H4Z" fill="currentColor"/></svg>
                </button>
                <button id="replay-restart" type="button" aria-label="Replay from start" title="Replay from start" disabled>
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6A7 7 0 1 1 3 12" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M2 8 3 1 9 6Z" fill="currentColor"/></svg>
                </button>
            </div>
            <select id="replay-speed" aria-label="Replay speed" disabled>
                <option value="1" data-hu="1 perc / mp" data-en="1 min / sec">1 perc / mp</option>
                <option value="5" selected data-hu="5 perc / mp" data-en="5 min / sec">5 perc / mp</option>
                <option value="15" data-hu="15 perc / mp" data-en="15 min / sec">15 perc / mp</option>
            </select>
        </div>
    </section>
    <script src="admin_message.js?v=20261102-language-demo1"></script>
    <script src="dashboard_help.js?v=20261102-english-help-only1"></script>
    <script src="plot_loading.js?v=20261102-loading1"></script>
    <script src="live_plot_data.js?v=20261104-history1"></script>
    <script src="boiler_power.js?v=20261111-replay2"></script>
    <script src="power_plot_bins.js?v=20261103-bin1"></script>
    <script src="cycle_heat_plots.js?v=20261111-replay2"></script>
    <script src="room_metric_plots.js?v=20261103-join1"></script>
    <script src="radiator_plots.js?v=20261111-replay2"></script>
    <script src="weather_plots.js?v=20261102-loading1"></script>
    <script src="room_control_plots.js?v=20261111-replay2"></script>
    <script src="room_phase_plots.js?v=20261102-language-demo1"></script>
    <script src="room_phase_summary.js?v=20261030-phase-summary9"></script>
    <script src="boiler_kpi_plots.js?v=20261102-loading1"></script>
    <script src="boiler_demand_bars.js?v=20261104-circuit-labels1"></script>
    <script src="boiler_metric_plots.js?v=20261104-water-validity1"></script>
    <script src="mobile_plot_views.js?v=20261102-language-demo1"></script>
    <script src="room_registry.js?v=20261111-replay2"></script>
    <script src="room_bootstrap.js"></script>
    <script src="room_overview.js?v=20261107-name-average1"></script>
    <script src="ambient_areas.js?v=20261111-replay2"></script>
    <script src="data.js?v=20261111-replay2"></script>
    <script src="draw.js?v=20261107-cold-boiler2"></script>
</body>

</html>
